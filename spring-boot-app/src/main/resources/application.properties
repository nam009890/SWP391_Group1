# ==========================================
# APPLICATION
# ==========================================
spring.application.name=demo
server.port=8080

# ==========================================
# DATABASE / JPA
# ==========================================
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript

# ==========================================
# AI PROVIDER / MODELS
# ==========================================
app.ai.enabled=${AI_GENERATION_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.openai.model=${OPENAI_MODEL:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ==========================================
# AI LIMITS / TIMEOUT
# ==========================================
app.ai.max-cards=${AI_MAX_CARDS:20}
app.ai.timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}
app.ai.daily-user-limit=${AI_DAILY_REQUEST_LIMIT:10}
app.ai.daily-global-limit=${AI_DAILY_GLOBAL_REQUEST_LIMIT:100}
app.ai.max-concurrent-per-user=${AI_MAX_CONCURRENT_PER_USER:1}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:6000}

# ==========================================
# FRONTEND / OAUTH SESSION
# ==========================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=5m

# ==========================================
# LOCAL DEMO (OPT-IN)
# ==========================================
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}

